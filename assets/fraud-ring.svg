<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="A closed ring of three buyers and three sellers trading one-dong orders, flagged for review.">
  <style>
    .k{font:500 10px ui-monospace,Menlo,monospace;fill:#8892A6;letter-spacing:.16em}
    .nt{font:700 11px ui-monospace,Menlo,monospace;fill:#fff}
    .lb{font:600 11px ui-monospace,Menlo,monospace;fill:#C0392B}
    .s{font:400 11px ui-monospace,Menlo,monospace;fill:#8892A6}
    .sg{font:600 12px ui-monospace,Menlo,monospace;fill:#3C4354}
    .big{font:700 15px 'Segoe UI',Helvetica,sans-serif;fill:#C0392B}
    .e{stroke:#C0392B;stroke-opacity:.45;stroke-width:1.3;fill:none}
    .pk{fill:#C0392B}
    .n{stroke-width:2}
    .n.b{fill:#C0392B;fill-opacity:.85;stroke:#C0392B}
    .n.s{fill:#C2703A;fill-opacity:.85;stroke:#C2703A}
    .ring{fill:none;stroke:#C0392B;stroke-width:1.6;stroke-dasharray:6 6;opacity:.55;animation:sp 22s linear infinite}
    @keyframes sp{to{stroke-dashoffset:-240}}
    .chip{fill:#C0392B;fill-opacity:.08;stroke:#C0392B;stroke-opacity:.5;stroke-width:1.2}
  </style>
  <text class="k" x="28" y="26">ABUSE HIDES IN RELATIONSHIPS, NOT IN TOTALS</text>
  <rect class="ring" x="212" y="34" width="298" height="212" rx="26"/>
  <text class="s" x="250" y="268" text-anchor="middle">buyers</text>
  <text class="s" x="470" y="268" text-anchor="middle">sellers</text>
    <path class="e" d="M266 70 C320 70 400 70 454 70"/>
    <circle class="pk" r="2.8"><animateMotion dur="2.6s" begin="-0.0s" repeatCount="indefinite" path="M266 70 C320 70 400 70 454 70"/></circle>
    <path class="e" d="M266 70 C320 70 400 140 454 140"/>
    <circle class="pk" r="2.8"><animateMotion dur="2.6s" begin="-0.22s" repeatCount="indefinite" path="M266 70 C320 70 400 140 454 140"/></circle>
    <path class="e" d="M266 70 C320 70 400 210 454 210"/>
    <circle class="pk" r="2.8"><animateMotion dur="2.6s" begin="-0.44s" repeatCount="indefinite" path="M266 70 C320 70 400 210 454 210"/></circle>
    <path class="e" d="M266 140 C320 140 400 70 454 70"/>
    <circle class="pk" r="2.8"><animateMotion dur="2.6s" begin="-0.66s" repeatCount="indefinite" path="M266 140 C320 140 400 70 454 70"/></circle>
    <path class="e" d="M266 140 C320 140 400 140 454 140"/>
    <circle class="pk" r="2.8"><animateMotion dur="2.6s" begin="-0.88s" repeatCount="indefinite" path="M266 140 C320 140 400 140 454 140"/></circle>
    <path class="e" d="M266 140 C320 140 400 210 454 210"/>
    <circle class="pk" r="2.8"><animateMotion dur="2.6s" begin="-1.1s" repeatCount="indefinite" path="M266 140 C320 140 400 210 454 210"/></circle>
    <path class="e" d="M266 210 C320 210 400 70 454 70"/>
    <circle class="pk" r="2.8"><animateMotion dur="2.6s" begin="-1.32s" repeatCount="indefinite" path="M266 210 C320 210 400 70 454 70"/></circle>
    <path class="e" d="M266 210 C320 210 400 140 454 140"/>
    <circle class="pk" r="2.8"><animateMotion dur="2.6s" begin="-1.54s" repeatCount="indefinite" path="M266 210 C320 210 400 140 454 140"/></circle>
    <path class="e" d="M266 210 C320 210 400 210 454 210"/>
    <circle class="pk" r="2.8"><animateMotion dur="2.6s" begin="-1.76s" repeatCount="indefinite" path="M266 210 C320 210 400 210 454 210"/></circle>
    <circle class="n b" cx="250" cy="70" r="16"/><text class="nt" x="250" y="74" text-anchor="middle">B1</text>
    <circle class="n b" cx="250" cy="140" r="16"/><text class="nt" x="250" y="144" text-anchor="middle">B2</text>
    <circle class="n b" cx="250" cy="210" r="16"/><text class="nt" x="250" y="214" text-anchor="middle">B3</text>
    <circle class="n s" cx="470" cy="70" r="16"/><text class="nt" x="470" y="74" text-anchor="middle">S1</text>
    <circle class="n s" cx="470" cy="140" r="16"/><text class="nt" x="470" y="144" text-anchor="middle">S2</text>
    <circle class="n s" cx="470" cy="210" r="16"/><text class="nt" x="470" y="214" text-anchor="middle">S3</text>
  <g transform="translate(600,52)">
    <text class="sg" x="0" y="0">Four signals, all four required</text>
    <rect class="chip" x="0" y="14" width="150" height="24" rx="12"/><text class="lb" x="12" y="30">pair frequency</text>
    <rect class="chip" x="160" y="14" width="168" height="24" rx="12"/><text class="lb" x="172" y="30">value at the floor</text>
    <rect class="chip" x="0" y="46" width="150" height="24" rx="12"/><text class="lb" x="12" y="62">one-sided flow</text>
    <rect class="chip" x="160" y="46" width="168" height="24" rx="12"/><text class="lb" x="172" y="62">new account age</text>
    <text class="s" x="0" y="96">Any one of them alone has an innocent explanation.</text>
    <text class="s" x="0" y="114">The rule is the intersection, and it flags for review,</text>
    <text class="s" x="0" y="132">never for automatic penalty.</text>
    <text class="big" x="0" y="168">3 buyers &#215; 3 sellers &#183; 1-VND orders</text>
  </g>
</svg>