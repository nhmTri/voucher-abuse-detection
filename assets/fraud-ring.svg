<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 356" width="1000" height="356" role="img" aria-label="Three buyer accounts and three seller accounts trading only with each other in a closed loop, lighting up edge by edge until the ring closes and the rule flags it, beside the four signals the rule checks.">
  <style>
    :root{color-scheme:light dark}
    .ttl{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1B2030;letter-spacing:.08em}
    .tag{font:600 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8892A6;letter-spacing:.18em}
    .nl{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#FFFFFF}
    .rn{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1B2030}
    .rv{font:400 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8892A6}
    .th{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#C0392B}
    .sub{font:400 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8892A6}
    .vb{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#C0392B;letter-spacing:.1em}
    .ok{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1F7A5A;letter-spacing:.1em}

    .edge{fill:none;stroke:#C0392B;stroke-width:2;stroke-linecap:round;
          stroke-dasharray:200;stroke-dashoffset:200;
          animation:draw .55s ease-out forwards, hum 3.6s ease-in-out 2.4s infinite}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes hum{0%,100%{stroke-opacity:.9}50%{stroke-opacity:.35}}

    .node{stroke-width:2.5;opacity:0;transform-box:fill-box;transform-origin:center;
          animation:pop .45s cubic-bezier(.34,1.3,.64,1) forwards}
    .node.b{fill:#C0392B;fill-opacity:.9;stroke:#C0392B}
    .node.s{fill:#8E44AD;fill-opacity:.9;stroke:#8E44AD}
    @keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}

    .halo{fill:none;stroke:#C0392B;stroke-width:2;opacity:0;
          animation:halo 2.6s ease-out 2.2s infinite}
    @keyframes halo{0%{opacity:.55;r:84}70%{opacity:0;r:116}100%{opacity:0;r:116}}

    .tick{fill:none;stroke:#C0392B;stroke-width:2;opacity:0;
          animation:fade .4s ease-out forwards}
    .chk{fill:none;stroke:#C0392B;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
         stroke-dasharray:12;stroke-dashoffset:12;animation:draw .3s ease-out forwards}
    .fade{opacity:0;animation:fade .5s ease-out forwards}
    @keyframes fade{to{opacity:1}}

    .mover{offset-path:path('M196 102 A56 56 0 1 1 195.9 102');offset-distance:0%;
           animation:ride 4.2s linear 2.6s infinite}
    @keyframes ride{to{offset-distance:100%}}

    @media (prefers-reduced-motion:reduce){
      .edge{stroke-dashoffset:0;animation:none}
      .node,.tick,.fade{opacity:1;animation:none}
      .chk{stroke-dashoffset:0;animation:none}
      .halo,.mover{display:none}
    }
    @media (prefers-color-scheme:dark){
      .ttl,.rn{fill:#E8ECF4} .tag,.rv,.sub{fill:#7F8AA0}
    }
  </style>

  <text class="tag" x="36" y="32">ONE CAMPAIGN · 1 VND ORDERS · SIX ACCOUNTS</text>

  <circle class="halo" cx="196" cy="158" r="84"/>
  <path class="edge" d="M196.0 74.0 Q218.6 118.9 268.7 116.0" style="animation-delay:0.25s"/>
  <path class="edge" d="M268.7 116.0 Q241.1 158.0 268.7 200.0" style="animation-delay:0.47s"/>
  <path class="edge" d="M268.7 200.0 Q218.6 197.1 196.0 242.0" style="animation-delay:0.69s"/>
  <path class="edge" d="M196.0 242.0 Q173.4 197.1 123.3 200.0" style="animation-delay:0.91s"/>
  <path class="edge" d="M123.3 200.0 Q150.9 158.0 123.3 116.0" style="animation-delay:1.13s"/>
  <path class="edge" d="M123.3 116.0 Q173.4 118.9 196.0 74.0" style="animation-delay:1.35s"/>
  <circle class="node b" cx="196.0" cy="74.0" r="17" style="animation-delay:0.00s"/>
  <text class="nl" x="196.0" y="78.0" text-anchor="middle">B1</text>
  <circle class="node s" cx="268.7" cy="116.0" r="17" style="animation-delay:0.10s"/>
  <text class="nl" x="268.7" y="120.0" text-anchor="middle">S1</text>
  <circle class="node b" cx="268.7" cy="200.0" r="17" style="animation-delay:0.20s"/>
  <text class="nl" x="268.7" y="204.0" text-anchor="middle">B2</text>
  <circle class="node s" cx="196.0" cy="242.0" r="17" style="animation-delay:0.30s"/>
  <text class="nl" x="196.0" y="246.0" text-anchor="middle">S2</text>
  <circle class="node b" cx="123.3" cy="200.0" r="17" style="animation-delay:0.40s"/>
  <text class="nl" x="123.3" y="204.0" text-anchor="middle">B3</text>
  <circle class="node s" cx="123.3" cy="116.0" r="17" style="animation-delay:0.50s"/>
  <text class="nl" x="123.3" y="120.0" text-anchor="middle">S3</text>
  <circle class="mover" r="4.5" fill="#C0392B"/>


  <circle cx="110" cy="276" r="6" fill="#C0392B" fill-opacity=".9" stroke="#C0392B" stroke-width="2"/>
  <text class="rv" x="124" y="280">buyer account</text>
  <circle cx="226" cy="276" r="6" fill="#8E44AD" fill-opacity=".9" stroke="#8E44AD" stroke-width="2"/>
  <text class="rv" x="240" y="280">seller account</text>

  <text class="tag" x="438" y="54">WHAT THE RULE CHECKS</text>
  <circle class="tick" cx="438" cy="82" r="6" style="animation-delay:1.90s"/>
  <path class="chk" d="M435 82 l2.3 2.4 l4.2 -4.8" style="animation-delay:2.00s"/>
  <text class="rn" x="456" y="86">pair frequency</text>
  <text class="rv" x="456" y="102">8 orders, same two accounts</text>
  <text class="th" x="968" y="86" text-anchor="end">&gt;= 6</text>
  <circle class="tick" cx="438" cy="134" r="6" style="animation-delay:2.18s"/>
  <path class="chk" d="M435 134 l2.3 2.4 l4.2 -4.8" style="animation-delay:2.28s"/>
  <text class="rn" x="456" y="138">value at the floor</text>
  <text class="rv" x="456" y="154">every order 1 VND</text>
  <text class="th" x="968" y="138" text-anchor="end">= min</text>
  <circle class="tick" cx="438" cy="186" r="6" style="animation-delay:2.46s"/>
  <path class="chk" d="M435 186 l2.3 2.4 l4.2 -4.8" style="animation-delay:2.56s"/>
  <text class="rn" x="456" y="190">one-sided flow</text>
  <text class="rv" x="456" y="206">buyer never sells back</text>
  <text class="th" x="968" y="190" text-anchor="end">1 way</text>
  <circle class="tick" cx="438" cy="238" r="6" style="animation-delay:2.74s"/>
  <path class="chk" d="M435 238 l2.3 2.4 l4.2 -4.8" style="animation-delay:2.84s"/>
  <text class="rn" x="456" y="242">account age</text>
  <text class="rv" x="456" y="258">both opened the same week</text>
  <text class="th" x="968" y="242" text-anchor="end">&lt; 30d</text>

  <rect class="fade" x="438" y="296" width="268" height="34" rx="6" fill="#C0392B" fill-opacity=".1" style="animation-delay:3.3s"/>
  <text class="vb fade" x="452" y="318" style="animation-delay:3.4s">9 PAIRS FLAGGED</text>
  <text class="ok fade" x="738" y="318" style="animation-delay:3.6s">0 ORDINARY BUYERS TOUCHED</text>

  <text class="ttl" x="36" y="316">A RING IS NOT A BIG NUMBER. IT IS A SHAPE.</text>
  <text class="sub" x="36" y="336">No single order looks wrong. The pair does — and only pair-level rules can see it.</text>
</svg>
